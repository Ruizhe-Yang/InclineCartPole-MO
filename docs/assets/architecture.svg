<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
<title id="title">InclineCartPole CompleteMission architecture</title>
<desc id="desc">Mission release and environment wind and ambient temperature feed the CartPole physical plant. The plant contains battery supply, four wheel drives, a cart-pendulum core, a release gate and sensors with sampled transport. Controller current requests and drive enable enter the plant. Measurements, tick, gateReleased and powerGood enter the controller. Plant telemetry and measurements, plus controller commands and status, branch to Displays for observation only.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#738495"/></marker></defs>
<g font-family="Arial, DejaVu Sans, sans-serif">
<rect x="1" y="1" width="1278" height="798" rx="22" fill="#fbfcfa" stroke="#d8e0e4" stroke-width="1.5"/>
<text x="48" y="57" font-size="31" font-weight="700" fill="#172b42" text-anchor="start">InclineCartPole · complete mission</text><text x="50" y="91" font-size="17" font-weight="400" fill="#526477" text-anchor="start">Conceptual architecture derived from the CompleteMission connections</text><rect x="50" y="148" width="238" height="102" rx="12" fill="white" stroke="#d8e0e4" stroke-width="1.5"/><text x="169.0" y="197.0" font-size="23" font-weight="600" fill="#172b42" text-anchor="middle">Mission</text><text x="169.0" y="220.0" font-size="13.5" font-weight="400" fill="#526477" text-anchor="middle">release request</text><rect x="50" y="303" width="238" height="106" rx="12" fill="white" stroke="#d8e0e4" stroke-width="1.5"/><text x="169.0" y="354.0" font-size="22" font-weight="600" fill="#172b42" text-anchor="middle">Environment</text><text x="169.0" y="377.0" font-size="13.5" font-weight="400" fill="#526477" text-anchor="middle">windX / windY · ambient</text><rect x="362" y="148" width="538" height="337" rx="16" fill="#f1f4f5" stroke="#315d73" stroke-width="2"/><text x="386" y="183" font-size="25" font-weight="700" fill="#172b42" text-anchor="start">CartPole physical plant</text><text x="386" y="210" font-size="15" font-weight="400" fill="#526477" text-anchor="start">CartPoleSystem · grouped internal components</text><rect x="386" y="235" width="237" height="72" rx="12" fill="white" stroke="#d8e0e4" stroke-width="1.5"/><text x="504.5" y="269.0" font-size="19" font-weight="600" fill="#172b42" text-anchor="middle">Battery supply</text><text x="504.5" y="292.0" font-size="13.5" font-weight="400" fill="#526477" text-anchor="middle">precharge + thermal paths</text><rect x="643" y="235" width="233" height="72" rx="12" fill="white" stroke="#d8e0e4" stroke-width="1.5"/><text x="759.5" y="269.0" font-size="19" font-weight="600" fill="#172b42" text-anchor="middle">Four wheel drives</text><text x="759.5" y="292.0" font-size="13.5" font-weight="400" fill="#526477" text-anchor="middle">electrical + mechanical</text><rect x="386" y="333" width="237" height="72" rx="12" fill="white" stroke="#d8e0e4" stroke-width="1.5"/><text x="504.5" y="367.0" font-size="19" font-weight="600" fill="#172b42" text-anchor="middle">Mechanical core</text><text x="504.5" y="390.0" font-size="13.5" font-weight="400" fill="#526477" text-anchor="middle">cart–pendulum + release gate</text><rect x="643" y="333" width="233" height="72" rx="12" fill="white" stroke="#d8e0e4" stroke-width="1.5"/><text x="759.5" y="367.0" font-size="18" font-weight="600" fill="#172b42" text-anchor="middle">Sensors + transport</text><text x="759.5" y="390.0" font-size="13.5" font-weight="400" fill="#526477" text-anchor="middle">local acquisition and delivery</text><text x="387" y="451" font-size="16" font-weight="400" fill="#526477" text-anchor="start">Physical states and measured data remain distinct.</text><path d="M 288 199 H 362" fill="none" stroke="#738495" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 288 356 H 362" fill="none" stroke="#738495" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="362" y="595" width="538" height="108" rx="12" fill="white" stroke="#d8e0e4" stroke-width="1.5"/><text x="631.0" y="647.0" font-size="25" font-weight="600" fill="#172b42" text-anchor="middle">Controller</text><text x="631.0" y="670.0" font-size="13.5" font-weight="400" fill="#526477" text-anchor="middle">CartController · supervision, control laws and current allocation</text><path d="M 440 595 V 485" fill="none" stroke="#738495" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="463" y="526" font-size="17" font-weight="400" fill="#526477" text-anchor="start">Current requests</text><text x="463" y="550" font-size="17" font-weight="400" fill="#526477" text-anchor="start">+ drive enable</text><path d="M 775 485 V 595" fill="none" stroke="#738495" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="793" y="516" font-size="16" font-weight="400" fill="#526477" text-anchor="start">measurements + tick</text><text x="793" y="539" font-size="16" font-weight="400" fill="#526477" text-anchor="start">gateReleased</text><text x="793" y="562" font-size="16" font-weight="400" fill="#526477" text-anchor="start">powerGood</text><rect x="1000" y="299" width="230" height="150" rx="15" fill="white" stroke="#315d73" stroke-width="2"/><text x="1115" y="335" font-size="25" font-weight="700" fill="#172b42" text-anchor="middle">Displays</text><text x="1115" y="361" font-size="16" font-weight="500" fill="#526477" text-anchor="middle">RunDisplay</text><text x="1115" y="402" font-size="16" font-weight="400" fill="#526477" text-anchor="middle">Engineering quantities</text><text x="1115" y="426" font-size="15" font-weight="600" fill="#315d73" text-anchor="middle">Observation only</text><path d="M 900 236 H 945 V 335 H 1000" fill="none" stroke="#738495" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="5 5"/><text x="927" y="187" font-size="16" font-weight="400" fill="#526477" text-anchor="start">Physical telemetry</text><text x="927" y="210" font-size="16" font-weight="400" fill="#526477" text-anchor="start">+ measurements</text><path d="M 900 650 H 974 V 397 H 1000" fill="none" stroke="#738495" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="5 5"/><text x="991" y="520" font-size="16" font-weight="400" fill="#526477" text-anchor="start">Commands + status</text><text x="991" y="544" font-size="16" font-weight="400" fill="#526477" text-anchor="start">for observation</text><path d="M 50 752 H 89" fill="none" stroke="#738495" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="101" y="758" font-size="14" font-weight="400" fill="#526477" text-anchor="start">Physical / control connection</text><path d="M 414 752 H 453" fill="none" stroke="#738495" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><text x="465" y="758" font-size="14" font-weight="400" fill="#526477" text-anchor="start">Observation branch</text><text x="784" y="758" font-size="14" font-weight="600" fill="#526477" text-anchor="start">No control feedback through Displays</text>
</g>
